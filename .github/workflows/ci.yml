name: CI

# The README made several claims about this project that nothing ever checked:
# a test count, a confidence band, and "firewall clean" on the demo buttons.
# Every one of them was wrong by the time anyone looked. This workflow exists
# so that a claim which stops being true fails a build instead of quietly
# sitting in a README.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, tests, eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app/

      - name: Tests
        run: pytest -q

      - name: Corpus is loadable and hashes to a stable version
        # Guards the regression that made `make up` run with no corpus at all:
        # the manifest resolved to /corpus in the container, loaded as empty,
        # and corpus_version() fell through to its placeholder hash.
        run: |
          python - <<'PY'
          from app.core.corpus import CORPUS_DIR, corpus_version, corpus_document_count
          n = corpus_document_count()
          v = corpus_version()
          assert n > 0, f"manifest loaded empty from {CORPUS_DIR}"
          assert len(v) == 12, f"unexpected corpus version: {v!r}"
          print(f"corpus {v} — {n} documents from {CORPUS_DIR}")
          PY

      - name: Eval — the pipeline verdict must be PASS
        # ragas_eval.py exits non-zero when any metric fails, so this step is
        # the gate. It used to be a no-op that reported ragas_used: false.
        run: |
          python -m app.eval.ragas_eval \
            --golden ../eval/golden_set.json \
            --out ../eval/report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/report.json
          if-no-files-found: ignore

  frontend:
    name: Frontend — typecheck, build, i18n parity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        # `.eslintrc.json` had never been committed, so `next lint` stopped at an
        # interactive "How would you like to configure ESLint?" prompt. This step
        # could not run unattended — it hung instead of failing, which is worse,
        # because a hang looks like a slow machine rather than a missing file.
        # `--max-warnings=0` makes it a gate: the tree is clean today, so any new
        # warning fails the build.
        run: npm run lint -- --max-warnings=0

      - name: Build
        run: npm run build

      - name: i18n parity and syntax gates
        # Runs from the repo root: these read frontend/ and need the
        # frontend's typescript, which `npm ci` has just installed.
        working-directory: .
        run: |
          node --experimental-strip-types eval/check_i18n.ts
          node --experimental-strip-types eval/check_frontend_syntax.ts
