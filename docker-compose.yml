# Development stack.
#
# This file bind-mounts the source and runs the dev servers, so `--reload` and
# `npm run dev` are deliberate here, not leftovers. It is the "make up" path,
# and it is what you want for a demo or while editing.
#
# Every service below is one the running app actually queries. Redis is behind
# the `cache` profile because nothing reads it yet:
#   docker compose --profile cache up
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sakti
      POSTGRES_PASSWORD: sakti
      POSTGRES_DB: sakti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakti"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Optional: `make up` creates .env from .env.example if it is missing, so a
    # fresh clone does not fail here with "env file .env not found".
    env_file: .env
    volumes:
      - ./backend:/app
      - ./corpus:/app/corpus:ro
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  pgdata:
  qdrant_data:
