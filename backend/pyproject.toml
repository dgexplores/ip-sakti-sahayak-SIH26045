[project]
name = "ip-sakti-sahayak"
version = "0.1.0"
description = "IP-SAKTI Sahayak — RAG for Ayurveda IP & regulatory guidance"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.110.0",
  "uvicorn[standard]==0.29.0",
  "pydantic==2.7.0",
  "pydantic-settings==2.3.0",
  "sqlmodel==0.0.18",
  "sqlalchemy==2.0.30",
  "alembic==1.13.1",
  "psycopg[binary]==3.1.18",
  "pgvector==0.3.6",
  "redis==5.0.5",
  "neo4j==5.22.0",
  "qdrant-client==1.9.0",
  "langchain==0.2.5",
  "langchain-openai==0.1.8",
  "langchain-community==0.2.5",
  "langgraph==0.1.5",
  "openai==1.35.0",
  "cohere==5.5.0",
  "sentence-transformers==3.0.1",
  "tiktoken==0.6.0",
  "pypdf==4.2.0",
  "python-docx==1.1.2",
  "python-multipart==0.0.9",
  "httpx==0.27.0",
  "structlog==24.1.0",
  "tenacity==8.5.0",
  "ragas==0.1.9",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.0",
  "pytest-asyncio==0.23.7",
  "httpx==0.27.0",
  "ruff==0.5.0",
  "mypy==1.10.0",
  "types-redis",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
